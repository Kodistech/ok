<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <style>
      :root {
        --primary: #d62828;
        --primary-dark: #a61c1c;
        --text: #2b2b2b;
        --bg: #fff5f5;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fff2f2, #ffd6d6);
        color: var(--text);
      }

      .card {
        width: min(92vw, 420px);
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(214, 40, 40, 0.2);
        padding: 28px;
        border-top: 6px solid var(--primary);
      }

      h1 {
        text-align: center;
        color: var(--primary);
        margin-bottom: 8px;
        font-size: 28px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 20px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      label {
        font-weight: bold;
        color: var(--text);
      }

      input {
        padding: 12px;
        border: 1px solid #f0b3b3;
        border-radius: 8px;
        outline: none;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(214, 40, 40, 0.15);
      }

      button {
        margin-top: 8px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .message {
        margin-top: 10px;
        text-align: center;
        font-size: 14px;
      }

      .link {
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
      }

      .link a {
        color: var(--primary);
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Đăng nhập</h1>
      <p class="subtitle">Chào mừng bạn trở lại</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Nhập email" required />

        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" required />

        <button type="submit">Đăng nhập</button>
      </form>
      <p id="message" class="message"></p>
      <p class="link">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </p>
    </div>

    <script src="login.js"></script>
  </body>
</html>
